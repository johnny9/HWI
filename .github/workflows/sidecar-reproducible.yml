name: Reproducible sidecars

on:
  pull_request:
    paths:
      - ".github/workflows/sidecar-reproducible.yml"
      - "contrib/guix/**"
      - "contrib/build_sidecar.sh"
      - "contrib/compare_sidecar_archives.py"
      - "contrib/generate_sidecar_manifest.py"
      - "contrib/linux_abi_report.py"
      - "contrib/macos_ad_hoc_sign.py"
      - "contrib/package_sidecar.py"
      - "hwilib/**"
      - "hwi.py"
      - "hwi-sidecar.spec"
      - "poetry.lock"
      - "pyproject.toml"
      - "test/test_sidecar_*.py"
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LC_ALL: C
  LANG: C
  PYTHONHASHSEED: "0"
  PYTHONNOUSERSITE: "1"

jobs:
  archive-tests:
    name: Sidecar metadata and archive tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run tests
        run: python3 -m unittest test.test_sidecar_manifest test.test_sidecar_archive

  linux-guix:
    name: Linux x86_64 Guix build ${{ matrix.reproducer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        reproducer: [a, b]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Guix bootstrap client
        run: |
          sudo apt-get update
          sudo apt-get install -y guix
          sudo systemctl start guix-daemon
          guix --version

      - name: Build unsigned sidecar
        env:
          HWI_GUIX_OUTPUT_DIR: dist/guix
        run: |
          test "$(uname -m)" = x86_64
          contrib/guix/build-sidecar

      - name: Preserve exact archive bytes
        run: |
          archive="$(find dist/guix -maxdepth 1 -type f -name 'hwi-*.tar.gz' -print -quit)"
          test -n "${archive}"
          mkdir -p build-sidecar-abi
          tar -xzf "${archive}" -C build-sidecar-abi
          python3 contrib/linux_abi_report.py \
            build-sidecar-abi/hwi --output build-sidecar-abi/report.json
          ABI_REPORT=build-sidecar-abi/report.json python3 -c \
            'import json, os; version=json.load(open(os.environ["ABI_REPORT"]))["maximum_glibc"]; assert version is not None and tuple(map(int, version.split("."))) <= (2, 35), version'
          cp "${archive}" "hwi-linux-${{ matrix.reproducer }}.tar.gz"
          sha256sum "hwi-linux-${{ matrix.reproducer }}.tar.gz"

      - name: Upload exact archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: hwi-linux-${{ matrix.reproducer }}.tar.gz
          archive: false

  linux-compare:
    name: Compare Linux reproducers
    needs: linux-guix
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: hwi-linux-*
          merge-multiple: true

      - name: Require bit-identical output
        run: |
          sha256sum hwi-linux-a.tar.gz hwi-linux-b.tar.gz
          python3 contrib/compare_sidecar_archives.py \
            hwi-linux-a.tar.gz hwi-linux-b.tar.gz

  macos-arm64:
    name: macOS arm64 determinism build ${{ matrix.reproducer }}
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        reproducer: [a, b]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Select pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Set deterministic build environment
        run: |
          test "$(uname -m)" = arm64
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "${GITHUB_ENV}"
          echo "PYINSTALLER_CONFIG_DIR=${RUNNER_TEMP}/hwi-pyinstaller" >> "${GITHUB_ENV}"

      - name: Build pinned libusb
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/libusb/libusb/releases/download/v1.0.29/libusb-1.0.29.tar.bz2 \
            --output "${RUNNER_TEMP}/libusb.tar.bz2"
          echo "5977fc950f8d1395ccea9bd48c06b3f808fd3c2c961b44b0c2e6e29fc3a70a85  ${RUNNER_TEMP}/libusb.tar.bz2" | shasum -a 256 --check
          mkdir -p "${RUNNER_TEMP}/libusb-source" "${RUNNER_TEMP}/libusb-stage"
          tar -xjf "${RUNNER_TEMP}/libusb.tar.bz2" \
            -C "${RUNNER_TEMP}/libusb-source" --strip-components=1
          (
            cd "${RUNNER_TEMP}/libusb-source"
            ./configure \
              --prefix=/hwi-libusb \
              --disable-dependency-tracking \
              --disable-static \
              --enable-shared
            make -j"$(sysctl -n hw.logicalcpu)"
            make install DESTDIR="${RUNNER_TEMP}/libusb-stage"
          )
          echo "HWI_LIBUSB_PATH=${RUNNER_TEMP}/libusb-stage/hwi-libusb/lib/libusb-1.0.dylib" >> "${GITHUB_ENV}"

      - name: Install locked HWI build environment
        run: |
          python -m pip install --disable-pip-version-check "poetry==2.3.1"
          poetry config virtualenvs.in-project true --local
          poetry install --sync --no-interaction

      - name: Build and finalize unsigned sidecar
        run: |
          contrib/build_sidecar.sh
          poetry run python contrib/macos_ad_hoc_sign.py dist/hwi
          poetry run python contrib/generate_sidecar_manifest.py \
            dist/hwi --platform macos --architecture arm64
          poetry run python contrib/package_sidecar.py \
            dist/hwi "hwi-macos-${{ matrix.reproducer }}.tar.gz"
          dist/hwi/hwi --version
          shasum -a 256 "hwi-macos-${{ matrix.reproducer }}.tar.gz"

      - name: Upload exact archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: hwi-macos-${{ matrix.reproducer }}.tar.gz
          archive: false

  macos-compare:
    name: Compare macOS determinism builds
    needs: macos-arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: hwi-macos-*
          merge-multiple: true

      - name: Require bit-identical output
        run: |
          sha256sum hwi-macos-a.tar.gz hwi-macos-b.tar.gz
          python3 contrib/compare_sidecar_archives.py \
            hwi-macos-a.tar.gz hwi-macos-b.tar.gz
