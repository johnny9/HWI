name: Reproducible bundles

on:
  pull_request:
    paths:
      - ".github/workflows/bundle-*.yml"
      - "contrib/oci/**"
      - "contrib/build_bundle.sh"
      - "contrib/compare_bundle_archives.py"
      - "contrib/generate_bundle_manifest.py"
      - "contrib/linux_abi_report.py"
      - "contrib/macos_abi_report.py"
      - "contrib/macos_ad_hoc_sign.py"
      - "contrib/package_bundle.py"
      - "contrib/bundle-targets.json"
      - "contrib/bundle_targets.py"
      - "contrib/windows_abi_report.py"
      - "hwilib/**"
      - "hwi.py"
      - "hwi-bundle.spec"
      - "poetry.lock"
      - "pyproject.toml"
      - "test/test_*bundle*.py"
      - "test/test_*abi*.py"
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LC_ALL: C
  LANG: C
  PYTHONHASHSEED: "0"
  PYTHONNOUSERSITE: "1"

jobs:
  targets:
    name: Validate Bitcoin Core target matrix
    runs-on: ubuntu-24.04
    outputs:
      linux: ${{ steps.matrix.outputs.linux }}
      linux_compare: ${{ steps.matrix.outputs.linux_compare }}
      macos: ${{ steps.matrix.outputs.macos }}
      macos_compare: ${{ steps.matrix.outputs.macos_compare }}
      windows: ${{ steps.matrix.outputs.windows }}
      windows_compare: ${{ steps.matrix.outputs.windows_compare }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate and expand targets
        id: matrix
        run: |
          python3 contrib/bundle_targets.py
          echo "linux=$(python3 contrib/bundle_targets.py --matrix linux-oci)" >> "${GITHUB_OUTPUT}"
          echo "linux_compare=$(python3 contrib/bundle_targets.py --matrix linux-oci --reproducers compare)" >> "${GITHUB_OUTPUT}"
          echo "macos=$(python3 contrib/bundle_targets.py --matrix macos)" >> "${GITHUB_OUTPUT}"
          echo "macos_compare=$(python3 contrib/bundle_targets.py --matrix macos --reproducers compare)" >> "${GITHUB_OUTPUT}"
          echo "windows=$(python3 contrib/bundle_targets.py --matrix windows)" >> "${GITHUB_OUTPUT}"
          echo "windows_compare=$(python3 contrib/bundle_targets.py --matrix windows --reproducers compare)" >> "${GITHUB_OUTPUT}"

  archive-tests:
    name: Bundle metadata, ABI, and archive tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run tests
        run: |
          python3 -m unittest \
            test.test_linux_abi_report \
            test.test_platform_abi_reports \
            test.test_bundle_manifest \
            test.test_bundle_archive \
            test.test_bundle_targets

  linux-oci:
    name: ${{ matrix.triple }} OCI build ${{ matrix.reproducer }}
    needs: targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container:
      image: ${{ matrix.oci_image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.linux) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned OCI build dependencies
        env:
          HWI_DEBIAN_SNAPSHOT: ${{ matrix.debian_snapshot }}
          HWI_PYTHON_VERSION: ${{ matrix.python_version }}
        run: contrib/oci/install-build-dependencies

      - name: Build unsigned bundle
        env:
          HWI_OCI_OUTPUT_DIR: dist/oci
          HWI_TARGET: ${{ matrix.triple }}
        run: contrib/oci/build-bundle

      - name: Validate and preserve exact archive bytes
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          ENDIANNESS: ${{ matrix.endianness }}
          EXPECTED_INTERPRETER: ${{ matrix.expected_interpreter }}
          GLIBC_MAXIMUM: ${{ matrix.glibc_maximum }}
          MACHINE: ${{ matrix.machine }}
          REPRODUCER: ${{ matrix.reproducer }}
          TARGET: ${{ matrix.triple }}
        run: |
          archive="$(find dist/oci -maxdepth 1 -type f -name "hwi-*-${TARGET}.tar.gz" -print -quit)"
          test -n "${archive}"
          mkdir -p build-bundle-abi
          tar -xzf "${archive}" -C build-bundle-abi
          python3 contrib/linux_abi_report.py \
            build-bundle-abi/hwi \
            --expected-machine "${MACHINE}" \
            --expected-endianness "${ENDIANNESS}" \
            --expected-interpreter "${EXPECTED_INTERPRETER}" \
            --maximum-glibc "${GLIBC_MAXIMUM}" \
            --output build-bundle-abi/report.json
          cp "${archive}" "hwi-${TARGET}-${REPRODUCER}.tar.gz"
          sha256sum "hwi-${TARGET}-${REPRODUCER}.tar.gz"

      - name: Upload exact archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hwi-${{ matrix.triple }}-${{ matrix.reproducer }}
          path: hwi-${{ matrix.triple }}-${{ matrix.reproducer }}.tar.gz
          if-no-files-found: error

  linux-compare:
    name: Compare ${{ matrix.triple }} OCI reproducers
    needs: [targets, linux-oci]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.linux_compare) }}
    steps:
      - name: Checkout comparison tool
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download exact archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: hwi-${{ matrix.triple }}-*
          merge-multiple: true

      - name: Require bit-identical output
        env:
          TARGET: ${{ matrix.triple }}
        run: |
          sha256sum "hwi-${TARGET}-a.tar.gz" "hwi-${TARGET}-b.tar.gz"
          python3 contrib/compare_bundle_archives.py \
            "hwi-${TARGET}-a.tar.gz" "hwi-${TARGET}-b.tar.gz"

  macos:
    name: ${{ matrix.triple }} build ${{ matrix.reproducer }}
    needs: targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.macos) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Select pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Set deterministic build environment
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          test "$(uname -m)" = "${ARCHITECTURE}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "${GITHUB_ENV}"
          echo "PYINSTALLER_CONFIG_DIR=/tmp/hwi-pyinstaller" >> "${GITHUB_ENV}"

      - name: Build pinned reproducible libusb
        run: |
          rm -rf /tmp/hwi-libusb-source /tmp/hwi-libusb-stage /tmp/hwi-libusb.tar.bz2
          curl --fail --location --silent --show-error \
            https://github.com/libusb/libusb/releases/download/v1.0.29/libusb-1.0.29.tar.bz2 \
            --output /tmp/hwi-libusb.tar.bz2
          echo "5977fc950f8d1395ccea9bd48c06b3f808fd3c2c961b44b0c2e6e29fc3a70a85  /tmp/hwi-libusb.tar.bz2" | \
            shasum -a 256 --check
          mkdir -p /tmp/hwi-libusb-source /tmp/hwi-libusb-stage
          tar -xjf /tmp/hwi-libusb.tar.bz2 -C /tmp/hwi-libusb-source --strip-components=1
          (
            cd /tmp/hwi-libusb-source
            CFLAGS="-O2 -ffile-prefix-map=/tmp/hwi-libusb-source=/usr/src/libusb" \
            LDFLAGS="-Wl,-no_uuid" \
            ./configure \
              --prefix=/hwi-libusb \
              --disable-dependency-tracking \
              --disable-static \
              --enable-shared
            make -j"$(sysctl -n hw.logicalcpu)"
            make install DESTDIR=/tmp/hwi-libusb-stage
          )
          echo "HWI_LIBUSB_PATH=/tmp/hwi-libusb-stage/hwi-libusb/lib/libusb-1.0.dylib" >> "${GITHUB_ENV}"

      - name: Install locked HWI build environment
        run: |
          python -m pip install --disable-pip-version-check "poetry==2.3.1"
          poetry config virtualenvs.in-project true --local
          poetry install --sync --no-interaction

      - name: Build and finalize unsigned bundle
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          MAXIMUM_MACOS: ${{ matrix.minimum_macos }}
          REPRODUCER: ${{ matrix.reproducer }}
          TARGET: ${{ matrix.triple }}
        run: |
          contrib/build_bundle.sh
          poetry run python contrib/macos_ad_hoc_sign.py dist/hwi
          poetry run python contrib/macos_abi_report.py \
            dist/hwi \
            --architecture "${ARCHITECTURE}" \
            --maximum-macos "${MAXIMUM_MACOS}" \
            --output dist/hwi-macos-abi.json
          poetry run python contrib/generate_bundle_manifest.py \
            dist/hwi --platform macos --architecture "${ARCHITECTURE}"
          poetry run python contrib/package_bundle.py \
            dist/hwi "hwi-${TARGET}-${REPRODUCER}.tar.gz"
          dist/hwi/hwi --version
          shasum -a 256 "hwi-${TARGET}-${REPRODUCER}.tar.gz"

      - name: Upload exact archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hwi-${{ matrix.triple }}-${{ matrix.reproducer }}
          path: hwi-${{ matrix.triple }}-${{ matrix.reproducer }}.tar.gz
          if-no-files-found: error

  macos-compare:
    name: Compare ${{ matrix.triple }} reproducers
    needs: [targets, macos]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.macos_compare) }}
    steps:
      - name: Checkout comparison tool
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download exact archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: hwi-${{ matrix.triple }}-*
          merge-multiple: true

      - name: Require bit-identical output
        env:
          TARGET: ${{ matrix.triple }}
        run: |
          sha256sum "hwi-${TARGET}-a.tar.gz" "hwi-${TARGET}-b.tar.gz"
          python3 contrib/compare_bundle_archives.py \
            "hwi-${TARGET}-a.tar.gz" "hwi-${TARGET}-b.tar.gz"

  windows:
    name: ${{ matrix.triple }} build ${{ matrix.reproducer }}
    needs: targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.windows) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Select pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Set deterministic build environment
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") { throw "Expected AMD64 runner" }
          "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PYINSTALLER_CONFIG_DIR=$env:RUNNER_TEMP\hwi-pyinstaller" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install pinned libusb
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\libusb-1.0.29.7z"
          $source = "$env:RUNNER_TEMP\libusb-1.0.29"
          curl.exe --fail --location --silent --show-error `
            https://github.com/libusb/libusb/releases/download/v1.0.29/libusb-1.0.29.7z `
            --output $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          if ($actual -ne "964a38152ca9a104cd00ec8d2f0617b89cd814f9b635e29763c68563d951521d") {
            throw "libusb archive hash mismatch: $actual"
          }
          7z x -y "-o$source" $archive "MinGW64/dll/libusb-1.0.dll"
          "HWI_LIBUSB_PATH=$source\MinGW64\dll\libusb-1.0.dll" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install locked HWI build environment
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "poetry==2.3.1"
          poetry config virtualenvs.in-project true --local
          poetry install --sync --no-interaction

      - name: Build and finalize unsigned bundle
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          REPRODUCER: ${{ matrix.reproducer }}
          TARGET: ${{ matrix.triple }}
        run: |
          poetry run pyinstaller --clean --noconfirm hwi-bundle.spec
          poetry run python contrib/generate_bundle_manifest.py `
            dist/hwi --platform windows --architecture $env:ARCHITECTURE
          poetry run python contrib/windows_abi_report.py `
            dist/hwi --architecture $env:ARCHITECTURE --output dist/hwi-windows-abi.json
          poetry run python contrib/package_bundle.py `
            dist/hwi "hwi-$env:TARGET-$env:REPRODUCER.tar.gz"
          & dist/hwi/hwi.exe --version
          Get-FileHash -Algorithm SHA256 "hwi-$env:TARGET-$env:REPRODUCER.tar.gz"

      - name: Upload exact archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hwi-${{ matrix.triple }}-${{ matrix.reproducer }}
          path: hwi-${{ matrix.triple }}-${{ matrix.reproducer }}.tar.gz
          if-no-files-found: error

  windows-compare:
    name: Compare ${{ matrix.triple }} reproducers
    needs: [targets, windows]
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.targets.outputs.windows_compare) }}
    steps:
      - name: Checkout comparison tool
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download exact archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: hwi-${{ matrix.triple }}-*
          merge-multiple: true

      - name: Require bit-identical output
        env:
          TARGET: ${{ matrix.triple }}
        run: |
          sha256sum "hwi-${TARGET}-a.tar.gz" "hwi-${TARGET}-b.tar.gz"
          python3 contrib/compare_bundle_archives.py \
            "hwi-${TARGET}-a.tar.gz" "hwi-${TARGET}-b.tar.gz"

  bundle-set:
    name: Assemble verified bundle bundle set
    needs: [archive-tests, linux-compare, macos-compare, windows-compare]
    runs-on: ubuntu-24.04
    steps:
      - name: Download reproduced archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: hwi-*-a
          merge-multiple: true

      - name: Create checksums
        run: |
          sha256sum hwi-*.tar.gz | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Upload verified bundle set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hwi-bundle-bundles-${{ github.sha }}
          path: |
            hwi-*.tar.gz
            SHA256SUMS
          if-no-files-found: error
